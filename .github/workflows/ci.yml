name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # 1. Lint — fast syntax check
  # ─────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/ api/ tests/ --select E,F,W --ignore E501,W503
        continue-on-error: true

  # ─────────────────────────────────────────────
  # 2. Unit tests — sem banco de dados
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install GDAL / spatial libs (ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev gdal-bin libspatialindex-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements-api.txt

      - name: Install package (editable)
        run: pip install -e . --no-deps

      - name: Run unit tests
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DB: test
          PG_USER: test
          PG_PASS: test
        run: |
          pytest tests/ -v --tb=short \
            --cov=src/recomendacao_imobiliaria \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=xml \
            -x

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ─────────────────────────────────────────────
  # 3. Build Docker images (só no push para main)
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Create .env para build
        run: |
          cp .env.example .env
          sed -i 's/^PG_HOST=.*/PG_HOST=db/' .env
          sed -i 's/^MLFLOW_TRACKING_URI=.*/MLFLOW_TRACKING_URI=http:\/\/mlflow:5000/' .env

      - name: Build API image
        run: docker build -f api/Dockerfile -t imobiliaria-api:ci .

      - name: Build Frontend image
        run: docker build -f frontend/Dockerfile -t imobiliaria-frontend:ci ./frontend

      - name: Smoke test — API starts
        run: |
          docker run -d --name api-smoke \
            -e PG_HOST=localhost -e PG_DB=test \
            -e PG_USER=test -e PG_PASS=test \
            -p 8000:8000 imobiliaria-api:ci &
          sleep 5
          # API should return 404 (no routes on /) not a crash
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || echo "000")
          echo "HTTP status: $HTTP"
          docker logs api-smoke || true
          docker stop api-smoke || true
