# Protótipo ISP isolado. Usa uma imagem pronta; não faz build na Hostinger.
name: urbia-isp-hostinger
services:
  dashboard:
    image: ${ISP_IMAGE:?Defina ISP_IMAGE nas variaveis do projeto}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${ISP_BIND_IP:-0.0.0.0}:${ISP_PUBLIC_PORT:-18089}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - isp
networks:
  isp: {}
