# ─────────────────────────────────────────────────────────────────────────────
# Stack de PRODUÇÃO — RecomendacaoImobiliaria
#
# Diferenças em relação ao docker-compose.yml de desenvolvimento:
#   - pgAdmin foi removido (painel de administração do banco nunca deve ficar
#     acessível publicamente).
#   - db, mlflow, minio e api NÃO publicam portas no host: só são alcançáveis
#     pela rede interna "backend", entre containers.
#   - Único ponto de entrada público é o Caddy (portas 80/443), que termina
#     TLS automaticamente (Let's Encrypt) e faz proxy para o frontend. O
#     frontend (nginx) já faz proxy interno de /api para o serviço "api".
#   - restart: always (em produção queremos religar sempre, inclusive após
#     reboot do host), e nenhuma credencial default: todas vêm do .env.prod.
#
# Uso:
#   cp .env.prod.example .env.prod   # preencha com segredos reais
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Pré-requisitos:
#   - DOMAIN e ACME_EMAIL no .env.prod apontando para um domínio real com
#     DNS já resolvendo para este host (o Caddy só emite certificado se
#     conseguir validar o domínio).
# ─────────────────────────────────────────────────────────────────────────────

name: recomendacao-imobiliaria-prod

services:
  db:
    image: postgis/postgis:15-3.5
    container_name: gp-db-prod
    environment:
      POSTGRES_DB: ${PG_DB:?Defina PG_DB no .env.prod}
      POSTGRES_USER: ${PG_USER:?Defina PG_USER no .env.prod}
      POSTGRES_PASSWORD: ${PG_PASS:?Defina PG_PASS no .env.prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./Infra/initdb:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: gp-minio-prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER no .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env.prod}
    volumes:
      - minio_prod:/data
    networks: [backend]
    restart: always
    profiles: [tools]
    security_opt:
      - no-new-privileges:true
    # Sem portas publicadas: o console 9001 e a API 9000 do MinIO nunca devem
    # ficar expostos direto na internet. Se algum dia for necessário acesso
    # externo a objetos, isso deve passar por URL pré-assinada emitida pela API,
    # nunca pelo MinIO diretamente.

  mlflow:
    image: ${DOCKERHUB_NAMESPACE:-alvarocareli}/recomendacaoimobiliaria-mlflow:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: gp-mlflow-prod
    volumes:
      - mlflow_data_prod:/mlflow
    networks: [backend]
    restart: always
    profiles: [tools]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',5000)); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  api:
    image: ${DOCKERHUB_NAMESPACE:-alvarocareli}/recomendacaoimobiliaria-api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: gp-api-prod
    environment:
      APP_ENV: production
      PG_HOST: db
      PG_PORT: "5432"
      PG_DB: ${PG_DB:?Defina PG_DB no .env.prod}
      PG_USER: ${PG_USER:?Defina PG_USER no .env.prod}
      PG_PASS: ${PG_PASS:?Defina PG_PASS no .env.prod}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MODEL_PATH: ${MODEL_PATH:-models/price_model.joblib}
      HF_TOKEN: ${HF_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env.prod}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS no .env.prod}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    networks: [backend]
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-alvarocareli}/recomendacaoimobiliaria-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: gp-frontend-prod
    depends_on:
      - api
    networks: [backend, edge]
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m

  caddy:
    image: caddy:2-alpine
    container_name: gp-caddy-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL no .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      - frontend
    restart: always
    security_opt:
      - no-new-privileges:true

networks:
  # Nenhum destes serviços publica portas no host, então nenhum é alcançável
  # de fora — mas eles precisam de saída para a internet (a API chama a
  # Hugging Face API e fontes oficiais de dados), então as redes NÃO usam
  # "internal: true" (isso bloquearia inclusive tráfego de saída).
  backend:
  edge:

volumes:
  pgdata_prod:
  minio_prod:
  mlflow_data_prod:
  caddy_data:
  caddy_config:
