[project]
name = "imobiliarianovo"
version = "0.1.0"
description = "Ferramenta de inteligencia territorial para recomendacao imobiliaria e urbana."
authors = [
    {name = "AlvaroCareli",email = "122116260+alvarosamp@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.1,<2.0.0",
    "shapely>=2.1.2,<3.0.0",
    "pyproj>=3.7.2,<4.0.0",
    "rtree>=1.4.1,<2.0.0",
    "psycopg2-binary>=2.9.11,<3.0.0",
    "sqlalchemy>=2.0.44,<3.0.0",
    "h3>=4.3.1,<5.0.0",
    "pandas>=2.3.3,<3.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "folium>=0.20.0,<0.21.0",
    "streamlit>=1.51.0,<2.0.0",
    "osmnx>=2.0.6,<3.0.0",
    "scikit-learn>=1.7.0,<2.0.0",
    "joblib>=1.5.0,<2.0.0",
    "numpy>=2.2.0,<3.0.0"
]

[project.scripts]
imobiliaria-score-demo = "recomendacao_imobiliaria.cli:score_demo"
imobiliaria = "recomendacao_imobiliaria.cli:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
